[project]
name = "nla"
version = "0.1.0"
description = "Metrics for NLA language alignment, claim support and claim importance (NLA pairs for Qwen models, inference-only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.13.0",           # CUDA build from PyPI (H200); EXP001's torch_xla path is retired
    "transformers>=5.16,<6",   # qwen3_5 (Qwen3.6) support
    "peft>=0.20",              # NLA AV = base + LoRA adapter
    "accelerate>=1.14",
    "flash-linear-attention==0.5.2",  # gated-DeltaNet kernels for the Qwen3.6 linear-attention blocks
    "hf-xet>=1.0",             # fast hub downloads
    "safetensors>=0.5",
    "huggingface-hub>=1.5",
    "datasets>=3.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyyaml>=6",
    "tqdm>=4.66",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nla"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["nla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
