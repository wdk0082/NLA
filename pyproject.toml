[project]
name = "nla"
version = "0.1.0"
description = "Metrics for NLA language alignment, claim support and claim importance (Qwen2.5-7B NLA, inference-only on Cloud TPU)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.0",            # pairs with torch_xla 2.9.0 (installed on the VM by gcp/bootstrap.sh)
    "transformers>=4.57,<6",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "datasets>=3.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyyaml>=6",
    "tqdm>=4.66",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nla"]

# Linux (the TPU VM) gets the CPU-only torch wheel — torch_xla brings the TPU
# runtime; macOS falls back to the default PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["nla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
